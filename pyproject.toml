[project]
name = "hms"
version = "0.1.0"
description = "Hospital Management System"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-guardian>=3.3,<3.4",
    "django-axes>=8,<9",
    "python-decouple>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "django-stubs>=5.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "DJ",   # flake8-django
]

ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "patients"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["decouple", "axes.*", "guardian.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.django-stubs]
django_settings_module = "config.settings"
