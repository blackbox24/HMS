{% extends "accounts/base_auth.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
  {% include "accounts/partials/_login_form.html" %}
{% endblock %}
{% block scripts %}
<div id="toast" class="toast" role="alert" hidden></div>
<script>
  /* Show/Hide password toggle (works for any .password-toggle on the page) */
  document.addEventListener("click", function (e) {
    var btn = e.target.closest(".password-toggle");
    if (!btn) return;
    var input = document.getElementById(btn.getAttribute("aria-controls"));
    var show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.textContent = show ? "Hide" : "Show";
    btn.setAttribute("aria-pressed", show ? "true" : "false");
  });

  /* Toast prompt on failed sign-in — fires after HTMX swaps the form,
     and once on full-page loads that already contain the error. */
  var toast = document.getElementById("toast");
  var toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.hidden = false;
    toast.classList.add("toast--show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove("toast--show");
      setTimeout(function () { toast.hidden = true; }, 300);
    }, 4000);
  }
  function checkForError() {
    var alert = document.querySelector("#login-form .alert--danger .alert-title");
    if (alert) showToast(alert.textContent.trim());
  }
  document.body.addEventListener("htmx:afterSwap", function (e) {
    if (e.detail.target && e.detail.target.id === "login-form") checkForError();
  });
  document.addEventListener("DOMContentLoaded", checkForError);
</script>
{% endblock %}
