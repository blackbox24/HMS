{% extends 'base.html' %}
{% block title %}Register Patient — HMS{% endblock %}
{% block content %}
<h1>Register Patient</h1>
<form method="post" class="card" style="max-width:900px">
  {% csrf_token %}
  <h2>Identity</h2>
  <div class="grid cols-3">
    <div><label>First name *</label><input name="first_name" required></div>
    <div><label>Middle name</label><input name="middle_name"></div>
    <div><label>Last name *</label><input name="last_name" required></div>
  </div>
  <div class="grid cols-3">
    <div><label>Date of birth *</label><input type="date" name="date_of_birth" required></div>
    <div><label>Gender *</label>
      <select name="gender" required>
        <option value="">—</option>
        <option value="M">Male</option><option value="F">Female</option><option value="O">Other</option>
      </select>
    </div>
    <div><label>Blood group</label>
      <select name="blood_group">
        {% for v,l in patient_blood_groups %}<option value="{{v}}">{{l}}</option>{% endfor %}
      </select>
    </div>
  </div>
  <h2>Contact</h2>
  <div class="grid cols-3">
    <div><label>Phone</label><input name="phone"></div>
    <div><label>Alt phone</label><input name="alt_phone"></div>
    <div><label>Email</label><input type="email" name="email"></div>
  </div>
  <div><label>Address</label><textarea name="address" rows="2"></textarea></div>
  <h2>Insurance &amp; ID</h2>
  <div class="grid cols-3">
    <div><label>NHIS number</label><input name="nhis_number"></div>
    <div><label>National ID / Passport</label><input name="national_id"></div>
    <div><label>Previous name</label><input name="previous_name"></div>
  </div>
  <h2>Next of Kin</h2>
  <div class="grid cols-3">
    <div><label>Name</label><input name="nok_name"></div>
    <div><label>Relationship</label><input name="nok_relationship"></div>
    <div><label>Phone</label><input name="nok_phone"></div>
  </div>
  <div><label>Notes</label><textarea name="notes" rows="2"></textarea></div>
  <div style="display:flex;gap:.5rem;margin-top:1rem">
    <button class="btn" type="submit">Register</button>
    <a class="btn secondary" href="{% url 'patient_list' %}">Cancel</a>
  </div>
</form>
{% endblock %}
