<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — HMS</title>
  <style>
    body { margin:0; font-family:system-ui,sans-serif; background:#f4f6f9; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:2rem; width:340px; }
    h1 { font-size:1.3rem; margin:0 0 1.5rem; color:#1e3a5f; }
    label { display:block; font-size:.85rem; font-weight:600; color:#475569; margin-bottom:.25rem; }
    input { width:100%; padding:.55rem .65rem; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:1rem; font-size:.95rem; }
    button { width:100%; padding:.6rem; background:#2563eb; color:#fff; border:none; border-radius:8px; font-size:1rem; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    .error { color:#991b1b; font-size:.85rem; margin-bottom:.75rem; }
  </style>
</head>
<body>
  <form class="card" method="post">
    {% csrf_token %}
    <h1>Hospital Management System</h1>
    {% if form.errors %}<div class="error">Invalid username or password.</div>{% endif %}
    <label for="id_username">Username</label>
    {{ form.username }}
    <label for="id_password">Password</label>
    {{ form.password }}
    <button type="submit">Sign in</button>
    <a href="{% url 'password_reset_request' %}" style="display:block;text-align:center;margin-top:.9rem;color:#2563eb;text-decoration:none;font-size:.88rem">Forgot password?</a>
  </form>
</body>
</html>
