{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password — HMS</title>
  <style>
    body { margin:0; font-family:system-ui,sans-serif; background:#f4f6f9; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:2rem; width:380px; }
    h1 { font-size:1.2rem; margin:0 0 1.25rem; color:#1e3a5f; }
    label { display:block; font-size:.85rem; font-weight:600; color:#475569; margin-bottom:.25rem; }
    input { width:100%; padding:.55rem .65rem; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:.9rem; font-size:.95rem; box-sizing:border-box; }
    ul.errorlist { color:#991b1b; font-size:.85rem; padding-left:1.2rem; margin:0 0 .9rem; }
    button { width:100%; padding:.6rem; background:#2563eb; color:#fff; border:none; border-radius:8px; font-size:1rem; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    .back { display:block; text-align:center; margin-top:1rem; color:#2563eb; text-decoration:none; font-size:.9rem; }
  </style>
</head>
<body>
  <form class="card" method="post">
    {% csrf_token %}
    <h1>Change Password</h1>
    {{ form.non_field_errors }}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
    {% endfor %}
    <button type="submit">Update password</button>
    <a class="back" href="{% url 'dashboard' %}">← Back to dashboard</a>
  </form>
  <script src="{% static 'js/password-toggle.js' %}"></script>
</body>
</html>
