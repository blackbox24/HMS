<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password — HMS</title>
  <style>
    body { margin:0; font-family:system-ui,sans-serif; background:#f4f6f9; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:2rem; width:380px; }
    h1 { font-size:1.2rem; margin:0 0 .5rem; color:#1e3a5f; }
    .hint { color:#64748b; font-size:.88rem; margin-bottom:1.25rem; }
    label { display:block; font-size:.85rem; font-weight:600; color:#475569; margin-bottom:.25rem; }
    input { width:100%; padding:.55rem .65rem; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:.9rem; font-size:.95rem; box-sizing:border-box; }
    button { width:100%; padding:.6rem; background:#2563eb; color:#fff; border:none; border-radius:8px; font-size:1rem; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    .back { display:block; text-align:center; margin-top:1rem; color:#2563eb; text-decoration:none; font-size:.9rem; }
    .flash { padding:.7rem .9rem; border-radius:8px; font-size:.88rem; margin-bottom:1rem; background:#e0f2fe; color:#075985; }
  </style>
</head>
<body>
  <form class="card" method="post">
    {% csrf_token %}
    <h1>Forgot password?</h1>
    <p class="hint">Enter your username. The administrator will issue you a temporary password.</p>
    {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
    <label for="id_username">Username</label>
    <input id="id_username" name="username" required autofocus>
    <button type="submit">Request reset</button>
    <a class="back" href="{% url 'login' %}">← Back to sign in</a>
  </form>
</body>
</html>
